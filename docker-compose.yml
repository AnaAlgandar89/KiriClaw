services:
  # Servicio de Base de Datos
  db:
    image: postgres:15-alpine  # Usamos una imagen ligera de PostgreSQL 15
    container_name: mikedb_container4
    restart: always
    environment:
      POSTGRES_USER: mike3
      POSTGRES_PASSWORD: super_secret_password4
      POSTGRES_DB: mikedb3
    ports:
      - "5435:5432" # Mapea el puerto del contenedor al de su máquina local
    volumes:
      - postgres_data3:/var/lib/postgresql/data  # Persistencia de datos

# Definición del volumen para que los datos no se pierdan al reiniciar
volumes:
  postgres_data3: